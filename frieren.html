<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frieren</title>
  <link rel="stylesheet" href="css/cards.css">
</head>
<body>
    <style>
        body {
            /* 1. Specify the path to your image file or an external URL */
            background-image: url('images/frieren.jpg');

            /* 2. Prevent the image from repeating like a tile grid */
            background-repeat: no-repeat;

            /* 3. Center the image horizontally and vertically */
            background-position: center center;

            /* 4. Scale the image to perfectly cover the entire screen */
            background-size: cover;

            /* 5. Keep the background fixed in place while scrolling */
            background-attachment: fixed;

            /* 6. Optional: Set a fallback color in case the image fails to load */
            background-color: #333333;
        }
    </style>

  <main class="card-container">
    <article class="card">
      <a href="https://frieren.fandom.com/wiki/Frieren" target="_blank">
        <img class="card-image" src="images/Frieren Characters/frieren-square.jpg" alt="Frieren">
      </a>
      <h2 class="card-title">Frieren</h2>
    </article>

    <article class="card">
      <a href="https://frieren.fandom.com/wiki/Fern" target="_blank">
        <img class="card-image" src="images/Frieren Characters/fern-square.jpg" alt="Fern">
      </a>
      <h2 class="card-title">Fern</h2>
    </article>

    <article class="card">
      <a href="https://frieren.fandom.com/wiki/Stark" target="_blank">
        <img class="card-image" src="images/Frieren Characters/stark-square.jpg" alt="Stark">
      </a>
      <h2 class="card-title">Stark</h2>
    </article>
  </main>

  <nav class="home-nav">
    <a class="home-button" href="index.html">Home</a>
  </nav>
</body>
</html>
