<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Welcome to Project Name — a short one-line description of the site.">
  <title>Project Name</title>
  <style>
    :root {
      --bg: #0f172a;
      --bg-accent: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at top, var(--bg-accent), var(--bg));
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      line-height: 1.6;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 2rem;
    }

    .logo {
      font-weight: 700;
      font-size: 1.25rem;
      letter-spacing: 0.05em;
    }

    nav a {
      color: var(--muted);
      text-decoration: none;
      margin-left: 1.5rem;
    }

    nav a:hover {
      color: var(--text);
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem 1rem;
    }

    h1 {
      font-size: clamp(2.5rem, 8vw, 5rem);
      line-height: 1.1;
      margin-bottom: 1rem;
    }

    .tagline {
      font-size: clamp(1rem, 2.5vw, 1.35rem);
      color: var(--muted);
      max-width: 40rem;
      margin-bottom: 2.5rem;
    }

    .actions {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      display: inline-block;
      padding: 0.85rem 2rem;
      border-radius: 999px;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.2s, color 0.2s;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      border: 2px solid var(--muted);
      color: var(--text);
    }

    .btn-secondary:hover {
      border-color: var(--text);
    }

    footer {
      text-align: center;
      padding: 1.5rem;
      color: var(--muted);
      font-size: 0.875rem;
    }

    @media (max-width: 600px) {
      header {
        flex-direction: column;
        gap: 0.75rem;
      }

      nav a {
        margin: 0 0.75rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">Project Name</div>
    <nav>
      <a href="#about">About</a>
      <a href="#features">Features</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <h1>Welcome to Project Name</h1>
    <p class="tagline">A short, compelling sentence that explains what this site is about and why visitors should care.</p>
    <div class="actions">
      <a href="#get-started" class="btn btn-primary">Get Started</a>
      <a href="#learn-more" class="btn btn-secondary">Learn More</a>
    </div>
  </main>

  <footer>
    <p>&copy; <span id="year"></span> Project Name. All rights reserved.</p>
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
